config:
  fontsize: 12

ant:
  - dsp.Antenna

line1:
  - dsp.Line: [{ d: r, l: 0.75 }] # unit/4

filt1:
  - dsp.Filter:
      [
        {
          response: bp,
          botlabel: "RF filter\n#1",
          anchor: W,
          lblofst: 0.2,
          fill: thistle,
        },
      ]

line2:
  - dsp.Line: [{ xy: "filt1.E", l: 0.75 }]

lna:
  - dsp.Amp: [{ label: "LNA", fill: lightblue }]

line3:
  - dsp.Line: [{ l: 0.75 }]

filt2:
  - dsp.Filter:
      [
        {
          response: bp,
          botlabel: "RF filter\n#2",
          anchor: W,
          lblofst: 0.2,
          fill: thistle,
        },
      ]

line4:
  - dsp.Line: [{ d: r, xy: "filt2.E", l: 1 }] # unit/3

mix:
  - dsp.Mixer: [{ label: Mixer, fill: navajowhite }]

line5:
  - dsp.Line: [{ d: d, xy: "mix.S", l: 1 }]

osc:
  - dsp.Oscillator:
      [
        {
          d: r,
          rgtlabel: "Local\nOscillator",
          lblofst: 0.2,
          anchor: N,
          fill: navajowhite,
        },
      ]

line6:
  - dsp.Line: [{ d: r, xy: "mix.E", l: 1 }]

filtIF:
  - dsp.Filter:
      [
        {
          response: bp,
          anchor: W,
          botlabel: "IF filter",
          lblofst: 0.2,
          fill: thistle,
        },
      ]

line7:
  - dsp.Line: [{ d: r, xy: "filtIF.E", l: 0.75 }]

amp:
  - dsp.Amp: [{ label: "IF\namplifier", fill: lightblue }]

line8:
  - dsp.Line: [{ l: 0.75 }]

demod:
  - dsp.Demod:
      [{ anchor: W, botlabel: Demodulator, lblofst: 0.2, fill: navajowhite }]

arrow:
  - dsp.Arrow: [{ d: r, xy: "demod.E", l: 1 }]
