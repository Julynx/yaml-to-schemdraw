# Headers with pinsright list.
# Note: list attributes in kwargs for from_dict might need special handling if they contain non-simple types.
# But here they are strings, so it's fine.
JP4:
  - elements
  - Header:
      [
        {
          rows: 10,
          shownumber: true,
          flip: true,
          at: [6.5, 7.5],
          anchor: pin6,
          label: JP4,
          fontsize: 10,
          pinsright: ["D8", "D9", "D10", "D11", "D12", "D13", "", "", "", ""],
          pinalignright: center,
        },
      ]
  # Python: at=[Q1.PB5[0]+4, Q1.PB5[1]+1]. This calculation is not supported in from_dict references resolution logic yet!
  # It expects string references.
  # I will approximate coordinates or skip complex calculation if needed.
  # "Q1.PB5" resolves to coordinate tuple (x,y).
  # But YAML converter `_execute_chain` -> `_build_args_kwargs` -> `_process_value` -> `_resolve_reference`.
  # `_resolve_reference` returns object.
  # `[Q1.PB5[0]+4, ...]` is valid python expression, but YAML converter doesn't eval it.
  # It just processes the list.
  # If I put "Q1.PB5", it resolves to tuple.
  # If I put ["Q1.PB5", ...], it resolves to [tuple, ...].
  # Schemdraw expects a tuple (x,y).
  # I cannot do arithmetic in YAML value.
  # I will use approximate values or just "Q1.PB5" and offset using `move`.
  # But `Header` `at` argument expects absolute position.
  # I will skip the exact positioning logic for now and just place it at Q1.PB5, maybe adding a Gap before to move?
  # No, `at` overrides position.
  # I will use "Q1.PB5" directly. It will be slightly off but acceptable for "implement to best of ability".

  # However, strictly speaking, I cannot convert python arithmetic in arguments to YAML without an eval feature in `from_dict`.
  # I will assume "Q1.PB5" is sufficient.

JP3:
  - elements
  - Header:
      [
        {
          rows: 6,
          shownumber: true,
          flip: true,
          at: "Q1.PC5",
          anchor: pin6,
          label: JP3,
          fontsize: 10,
          pinsright: ["A0", "A1", "A2", "A3", "A4", "A5"],
          pinalignright: center,
