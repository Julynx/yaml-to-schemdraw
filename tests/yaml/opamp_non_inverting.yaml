op:
  - elements
  - Opamp

line1:
  - elements
  - Line: [{ xy: "op.out", l: 0.75 }]

line2:
  - elements
  - Line: [{ d: l, xy: "op.in1", l: 0.75 }]

line3:
  - elements
  - Line: [{ d: u, l: 1.5 }]

dot1:
  - elements
  - Dot

R1:
  - elements
  - Resistor: [{ d: l, label: "$R_1$" }]

gnd1:
  - elements
  - Ground

gap1:
  - elements.Gap: [{ xy: "op.out", d: r, l: 0.5 }]

Rf:
  - elements
  - Resistor: [{ d: r, xy: "R1.start", tox: "gap1.end", label: "$R_f$" }]

line4:
  - elements
  - Line: [{ d: d, toy: "op.out" }]

dot2:
  - elements
  - Dot

line5:
  - elements
  - Line: [{ d: l, xy: "op.in2", l: 0.75 }]

dot3:
  - elements
  - Dot

R3:
  - elements
  - Resistor: [{ d: d, label: "$R_3$" }]

dot4:
  - elements
  - Dot

gnd2:
  - elements
  - Ground

R2:
  - elements
  - Resistor: [{ d: l, xy: "R3.start", label: "$R_2$" }]

V1:
  - elements
  - SourceV: [{ d: d, reverse: true, label: "$v_{in}$" }]

line6:
  - elements
  - Line: [{ d: r, tox: "Rf.end" }]

gap:
  - elements
  - Gap: [{ d: d, xy: "dot2.start", toy: "R3.end", label: ["+", "$v_o$", "–"] }]
