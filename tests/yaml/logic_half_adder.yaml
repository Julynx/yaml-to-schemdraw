config:
  unit: 0.5

S:
  - logic.Xor: [{ rgtlabel: "$S$" }]

A:
  - logic.Dot: [{ xy: "S.in1" }]

lineA:
  - logic.Line: [{ d: left, l: 1, lftlabel: "$A$" }] # unit*2 = 1

lineIn2:
  - logic.Line: [{ d: left, xy: "S.in2" }]

B:
  - logic.Dot

lineB:
  - logic.Line: [{ d: left, lftlabel: "$B$" }]

lineDownA:
  - logic.Line: [{ d: down, xy: "A.start", l: 1.5 }] # unit*3

C:
  - logic.And: [{ d: right, anchor: in1, rgtlabel: "$C$" }]

lineDownB:
  - logic.Line: [{ d: down, xy: "B.start", toy: "C.in2" }]

lineConnectB:
  - logic.Line: [{ to: "C.in2" }]
